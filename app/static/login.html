<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #2a2f3a;
    --text: #e6e8eb;
    --muted: #8b93a1;
    --accent: #5b8cff;
    --danger: #ff6b6b;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    width: 100%;
    max-width: 340px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 28px;
  }
  h1 {
    font-size: 18px;
    margin: 0 0 6px;
    font-weight: 600;
  }
  p.sub {
    margin: 0 0 20px;
    font-size: 13px;
    color: var(--muted);
  }
  label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin: 14px 0 6px;
  }
  input {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #0f1115;
    color: var(--text);
    font-size: 14px;
  }
  input:focus { outline: none; border-color: var(--accent); }
  button {
    width: 100%;
    margin-top: 20px;
    padding: 10px 16px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover:not(:disabled) { background: #4979eb; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .error {
    margin-top: 14px;
    font-size: 13px;
    color: var(--danger);
    min-height: 16px;
  }
</style>
</head>
<body>

<div class="card">
  <h1>OCR + Vector Search</h1>
  <p class="sub">Sign in to continue.</p>
  <form id="login-form">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" autocomplete="username" required>
    <label for="password">Password</label>
    <input type="password" id="password" name="password" autocomplete="current-password" required>
    <button type="submit" id="submit-btn">Sign in</button>
    <div class="error" id="error"></div>
  </form>
</div>

<script>
const form = document.getElementById("login-form");
const submitBtn = document.getElementById("submit-btn");
const errorEl = document.getElementById("error");

function nextUrl() {
  const params = new URLSearchParams(window.location.search);
  const next = params.get("next");
  return next && next.startsWith("/") ? next : "/ingest";
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  submitBtn.disabled = true;
  errorEl.textContent = "";

  const body = new URLSearchParams();
  body.set("email", document.getElementById("email").value);
  body.set("password", document.getElementById("password").value);

  try {
    const res = await fetch("/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: body.toString(),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || `HTTP ${res.status}`);
    window.location.href = nextUrl();
  } catch (err) {
    errorEl.textContent = err.message;
    submitBtn.disabled = false;
  }
});
</script>

</body>
</html>
